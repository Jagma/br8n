[package]
name = "br8n"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "AGPL-3.0-only"
description = "Local semantic search over your notes, papers and past agent sessions, injected into Claude Code, Codex and other agents"
repository = "https://github.com/Jagma/br8n"
autotests = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
toml_edit = "0.22"
strsim = "0.11"
directories = "5"
libc = "0.2"
memmap2 = "0.9"
lbug = "0.19"
ignore = "0.4"
gray_matter = "0.3"
pulldown-cmark = "0.13"
regex = "1"
once_cell = "1"
pdf-inspector = "1.17"
thiserror = "2"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dom_smoothie = "0.18"
htmd = "0.5"
url = "2"
text-splitter = { version = "0.32", features = ["markdown", "tokenizers"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.1", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"
rust-embed = "8"
usearch = "2"
tar = "0.4"
flate2 = "1"
semver = "1"
chacha20poly1305 = { version = "0.10", features = ["stream", "getrandom"], optional = true }
hmac = { version = "0.12", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
aws-config = { version = "1", features = ["behavior-version-latest"], optional = true }
aws-sdk-s3 = { version = "1", optional = true }
google-drive3 = { version = "7", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
mime = { version = "0.3", optional = true }
http-body-util = { version = "0.1", optional = true }

[features]
default = ["backup", "ocr"]
backup = [
    "dep:aws-config",
    "dep:aws-sdk-s3",
    "dep:google-drive3",
    "dep:chacha20poly1305",
    "dep:hmac",
    "dep:rustls",
    "dep:http-body-util",
    "dep:mime",
]
ocr = ["pdf-inspector/ocr"]

[[bin]]
name = "br8n"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.sha2]
opt-level = 3

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[[test]]
name = "it"
path = "tests/it/main.rs"

[[test]]
name = "bench"
path = "tests/bench.rs"

[[test]]
name = "dashboard"
path = "tests/dashboard.rs"

[[test]]
name = "golden"
path = "tests/golden.rs"

[[test]]
name = "index"
path = "tests/index.rs"

[[test]]
name = "loaders_pdf"
path = "tests/loaders_pdf.rs"

[[test]]
name = "memory_embed_backend"
path = "tests/memory_embed_backend.rs"

[[test]]
name = "memory_self_yield"
path = "tests/memory_self_yield.rs"

[[test]]
name = "retrieve_store_wiring"
path = "tests/retrieve_store_wiring.rs"

[[test]]
name = "session_start_trigger"
path = "tests/session_start_trigger.rs"

[[test]]
name = "status_lines"
path = "tests/status_lines.rs"

[[test]]
name = "transcript_deferral_cli"
path = "tests/transcript_deferral_cli.rs"

[[test]]
name = "transcript_settle"
path = "tests/transcript_settle.rs"

[[test]]
name = "update_notice"
path = "tests/update_notice.rs"
